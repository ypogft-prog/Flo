name: Install FLO Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FLO project
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "FLO ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/flo
          unzip -q "$ZIP" -d /tmp/flo

          PROJECT=$(find /tmp/flo -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          find . -mindepth 1 -maxdepth 1 \
  ! -name ".git" \
  ! -name "*.zip" \
  ! -name ".github" \
  -exec rm -rf {} +

find "$PROJECT" -mindepth 1 -maxdepth 1 \
  ! -name ".github" \
  -exec cp -R {} . \;

      - name: Commit FLO project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace repository with FLO project" || echo "Nothing to commit"
          git push
